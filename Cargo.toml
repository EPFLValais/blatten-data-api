[package]
name = "blatten-data-api"
version = "1.0.2"
edition = "2021"
description = "STAC API server for the Birch Glacier Collapse Dataset"
license = "MIT"
repository = "https://github.com/ALPOLE/blatten-data-api"

[[bin]]
name = "blatten-api"
path = "src/main.rs"

[[bin]]
name = "stac-gen"
path = "src/bin/stac_gen.rs"
required-features = ["generator"]

[features]
default = []
generator = ["dep:csv", "dep:gdal", "dep:las", "dep:zip", "dep:regex", "dep:rayon", "dep:indicatif", "dep:walkdir", "reqwest/blocking", "dep:sha2", "dep:xxhash-rust", "dep:serde_yaml", "dep:calamine", "dep:jsonschema", "dep:percent-encoding"]

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1", features = ["full"] }
url = "2"
tower = { version = "0.4", features = ["util"] }
http-body = "1"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "compression-br"] }

# STAC types (official implementation)
stac = "0.10"
stac-api = "0.6"
geojson = "0.24"
geo-types = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Configuration
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Fuzzy text search
strsim = "0.11"

# Download statistics: Postgres storage and Keycloak token check
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "chrono"] }
axum-keycloak-auth = { version = "0.6.0", default-features = false, features = ["rustls-tls"] }
# Reading the file proxy's metrics
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Generator-specific dependencies (optional)
csv = { version = "1", optional = true }
gdal = { git = "https://github.com/georust/gdal", features = ["bindgen"], optional = true }
las = { version = "0.9", features = ["laz"], optional = true }
zip = { version = "2", optional = true }
regex = { version = "1", optional = true }
rayon = { version = "1.10", optional = true }
indicatif = { version = "0.17", optional = true }
walkdir = { version = "2.4", optional = true }
sha2 = { version = "0.10", optional = true }
xxhash-rust = { version = "0.8", features = ["xxh64"], optional = true }
serde_yaml = { version = "0.9", optional = true }
calamine = { version = "0.26", optional = true }
jsonschema = { version = "0.33", default-features = false, optional = true }
percent-encoding = { version = "2", optional = true }
cql2 = "0.6"

[dev-dependencies]
flate2 = "1"
futures-util = "0.3"
jsonwebtoken = "9"

[profile.release]
lto = true
codegen-units = 1
